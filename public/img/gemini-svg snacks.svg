<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f"/>
      <stop offset="100%" stop-color="#023047"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Formas decorativas de fondo -->
  <circle cx="700" cy="80" r="140" fill="#ffb703" opacity="0.25"/>
  <circle cx="100" cy="420" r="160" fill="#fb8500" opacity="0.2"/>
  
  <!-- Elementos centrales -->
  <g transform="translate(400, 210)" text-anchor="middle">
    <!-- Iconos representativos -->
    <text y="-20" font-size="100">🥑 🍎 🥜</text>
    
    <!-- Títulos estilizados -->
    <text y="70" font-size="38" font-weight="bold" fill="#ffffff" font-family="'Segoe UI', sans-serif">
      Snacks Saludables
    </text>
    <text y="110" font-size="20" fill="#ffb703" font-family="'Segoe UI', sans-serif" letter-spacing="1">
      MINIMARKET DSY • VIDA SANA
    </text>
  </g>
</svg>
